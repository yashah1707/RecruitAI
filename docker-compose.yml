# Local PostgreSQL for development.
#
#   docker compose up -d        start it
#   alembic upgrade head        create the tables
#   python -m backend.seed      load regulators and schools
#
# The credentials below are for a throwaway local database only. A real
# deployment sets its own DATABASE_URL and never uses these.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recruitai
      POSTGRES_PASSWORD: recruitai
      POSTGRES_DB: recruitai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recruitai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recruitai_pgdata:
